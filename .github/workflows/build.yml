name: Build installers

# Releases에서 v로 시작하는 태그(예: v1.0.0)로 릴리스를 게시하면, 빌드 후 그 릴리스에 설치파일을 첨부한다.
# Actions 탭에서 수동 실행(Run workflow)하면 시험 빌드만 하고 Artifacts로 내려받을 수 있다.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: mac-applesilicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0 pyinstaller-hooks-contrib==2024.8

      - name: Build app with PyInstaller
        run: pyinstaller pdf2md.spec --noconfirm --clean

      # ---------- Smoke test: modules bundled, window + conversion work, real OCR runs ----------
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\PDF2MD\PDF2MD.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","selftest.txt","--with-ocr" -Wait -PassThru
          Get-Content selftest.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\PDF2MD\pdf2md.log" -Tail 80 -ErrorAction SilentlyContinue
            Write-Error "selftest failed"; exit 1
          }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN="dist/PDF2MD.app/Contents/MacOS/PDF2MD"
          if ! "$BIN" --selftest selftest.txt --with-ocr; then
            cat selftest.txt || true
            tail -80 ~/Library/Logs/PDF2MD/pdf2md.log || true
            exit 1
          fi
          cat selftest.txt

      # ---------- Package ----------
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dmg
          ditto dist/PDF2MD.app dmg/PDF2MD.app
          ln -s /Applications dmg/Applications
          OUT="dist/PDF2MD-${APP_VERSION}-mac-applesilicon.dmg"
          for i in 1 2 3; do
            hdiutil create -volname PDF2MD -srcfolder dmg -ov -format UDZO "$OUT" && break
            sleep 15
          done
          test -f "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF2MD-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
